# rustid-server for the OpenID Foundation FAPI-CIBA ID1 plan
# (scripts/conformance.sh fapi-ciba): HTTPS on https://localhost:9445 with
# client certificates requested (FAPI-CIBA binds tokens to them), signed
# CIBA requests, PS256, and CIBA hooks served by approver.py, which also
# answers the suite's automated approval calls. Conformance only.
# Relative paths are resolved against this file's directory.
listen = "127.0.0.1:9445"
clients_file = "clients.json"
resources_file = "../resources.json"

[log]
format = "pretty"
level = "info"

[protocol]
emit_scopes_as_space_delimited_string_in_jwt = true
supported_client_assertion_signing_algorithms = ["PS256", "ES256"]
supported_request_object_signing_algorithms = ["PS256", "ES256"]
# FAPI-CIBA: request objects carry nbf and exp at most 60 minutes apart.
request_object_max_lifetime = "01:00:00"
jwt_validation_clock_skew = 60

[protocol.key_management]
enabled = false

# mTLS: discovery advertises certificate-bound tokens and the
# /connect/mtls/* aliases, and the conformance clients require
# certificate-bound tokens (requireCertificateBoundTokens).
[protocol.mutual_tls]
enabled = true
always_emit_confirmation_claim = true

[[signing_keys]]
kid = "conformance-ps256"
alg = "PS256"
key_file = "../../fixtures/signing-key.pem"

[client_authentication]
private_key_jwt = true

# The resource the plan calls with its certificate-bound access tokens.
[protected_resource]
path = "/fapi-ciba/resource"

# The approver signs alice in here to complete requests.
[reference_ui]
enabled = true
interactive = true
users_profile_service = true
users_file = "../users.json"

[interaction]
api_keys = ["fapi-ciba-approver-key"]

[hooks.ciba_user]
url = "http://127.0.0.1:5451/ciba/user"

[hooks.ciba_notification]
url = "http://127.0.0.1:5451/ciba/notify"

[tls]
cert_file = "../../target/conformance/cert.pem"
key_file = "../../target/conformance/key.pem"
client_certificates = "request"
# FAPI's TLS 1.2 suites are ECDHE-RSA only and this certificate is ECDSA, so
# the listener offers TLS 1.3 alone, which FAPI allows (as fapi2/rustid.toml).
cipher_suites = "fapi"
