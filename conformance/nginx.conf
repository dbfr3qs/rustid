# The conformance suite's TLS front, on loopback only (host networking).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # The suite has requests that block waiting for callbacks (up to 60s).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=$host;proto=$scheme";
            proxy_pass_request_headers on;
        }
    }

    server {
        listen 127.0.0.1:8444 ssl;
        server_name localhost;
        ssl_verify_client optional_no_ca;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8444;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
            proxy_pass_request_headers on;
        }
    }
}
